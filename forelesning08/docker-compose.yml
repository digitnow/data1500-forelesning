services:
  postgres:
    image: postgres:15-alpine
    container_name: forel08-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: forel08
    ports:
      - "5462:5432"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d

      - postgres_data_forel08:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
      - ./test-scripts:/test-scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d forel08"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_forel08:
    driver: local

networks:
  data1500-network:
    driver: bridge